[package]
name = "att-node"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "Network services of the Agent Trust testbed: APF authority, agent sidecar, relay and a mock QRNG"

[[bin]]
name = "att-node"
path = "src/main.rs"

[dependencies]
agent-trust.workspace = true
openmls.workspace = true
openmls_traits.workspace = true
openmls_basic_credential.workspace = true
openmls_rust_crypto = { git = "https://github.com/dasobral/openmls.git", rev = "dd33278099426c2ffc8a4ec686e88bde1f937963" }
serde_json = "1.0"
hex = "0.4"
sha2 = "0.10"
tiny_http = "0.12"
ureq = { version = "2", default-features = false, features = ["json"] }
base64 = "0.22"
getrandom = "0.2"
tls_codec = "0.5"
rusqlite = { version = "0.40", features = ["bundled"] }
