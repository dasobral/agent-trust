[package]
name = "att-node"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "Network services of the Agent Trust testbed: APF authority, agent sidecar, relay and a mock QRNG"

[[bin]]
name = "att-node"
path = "src/main.rs"

[dependencies]
agent-trust.workspace = true
openmls.workspace = true
openmls_traits.workspace = true
openmls_basic_credential.workspace = true
openmls_rust_crypto = { git = "https://github.com/dasobral/openmls.git", rev = "dd33278099426c2ffc8a4ec686e88bde1f937963" }
serde_json = "1.0"
hex = "0.4"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
# Post quantum TLS (PQ-2, PQ-4): aws-lc-rs for X25519MLKEM768 and ML-DSA-44 certificates.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs_unstable", "pem", "x509-parser"] }
x509-parser = "0.16"
base64 = "0.22"
getrandom = "0.2"
tls_codec = "0.5"
rusqlite = { version = "0.40", features = ["bundled"] }
