[package]
name = "agent-trust"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false
license = "MIT"
readme = "README.md"
repository = "https://github.com/dasobral/agent-trust"
homepage = "https://github.com/dasobral/agent-trust"
authors = ["Daniel Sobral Blanco <dasobral93@gmail.com>"]
keywords = ["mls", "authorization", "openmls", "capability", "delegation"]
categories = ["cryptography"]
description = "Experimental laboratory for authorization-capability coherence with MLS agent principals"

[lib]
name = "agent_trust"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
openmls = { git = "https://github.com/dasobral/openmls.git", rev = "dd33278099426c2ffc8a4ec686e88bde1f937963", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_traits = { git = "https://github.com/dasobral/openmls.git", rev = "dd33278099426c2ffc8a4ec686e88bde1f937963", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_rust_crypto = { git = "https://github.com/dasobral/openmls.git", rev = "dd33278099426c2ffc8a4ec686e88bde1f937963", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_basic_credential = { git = "https://github.com/dasobral/openmls.git", rev = "dd33278099426c2ffc8a4ec686e88bde1f937963", features = ["clonable", "draft-ietf-mls-pq-ciphersuites"] }
tls_codec = "0.5"
openmls_sqlite_storage = { git = "https://github.com/dasobral/openmls.git", rev = "dd33278099426c2ffc8a4ec686e88bde1f937963", features = ["draft-ietf-mls-pq-ciphersuites"] }
# The lab crypto provider (C-40): its HMAC-DRBG is seeded from the selected entropy source.
openmls_libcrux_crypto = { git = "https://github.com/dasobral/openmls.git", rev = "dd33278099426c2ffc8a4ec686e88bde1f937963", features = ["draft-ietf-mls-pq-ciphersuites"] }
# `SysRng`, the OS entropy source of the lab crypto provider for the `os` source.
rand = "0.10"
ed25519-dalek = "2"
# ML-DSA key derivation from a seed (C-42); the same crate signs inside openmls_basic_credential.
ml-dsa = "=0.1.1"
# Lab entropy selection (C-40): QRNG-backed OpenMLS rand provider. The `mock` feature adds
# MockEntropy, a seeded in-process backend that is NOT an entropy source.
openmls_qrand = { git = "https://github.com/dasobral/openmls-qrand.git", rev = "a102450febaa00e8955822c72bd309df6d8f43b9", features = ["mock"] }
toml = "1"
url = "2"

[dev-dependencies]
tempfile = "3"
# Phase 4.6 entropy seam tests: a loopback mock of the QRNG Open API.
tiny_http = "0.12"

# openmls_qrand depends on crates.io openmls_traits 0.6.0; resolve it to the pinned fork so
# its provider implements the same OpenMlsProvider trait as the rest of the graph.
[patch.crates-io]
openmls_traits = { git = "https://github.com/dasobral/openmls.git", rev = "dd33278099426c2ffc8a4ec686e88bde1f937963" }
