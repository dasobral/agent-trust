[package]
name = "agent-trust"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false
license = "MIT"
readme = "README.md"
repository = "https://github.com/dasobral/agent-trust"
homepage = "https://github.com/dasobral/agent-trust"
authors = ["Daniel Sobral Blanco <dasobral93@gmail.com>"]
keywords = ["mls", "authorization", "openmls", "capability", "delegation"]
categories = ["cryptography"]
description = "Experimental laboratory for authorization-capability coherence with MLS agent principals"

[lib]
name = "agent_trust"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
openmls = { git = "https://github.com/dasobral/openmls.git", rev = "6daabe33ddb616a6ed54b511d333e691db18a99f" }
openmls_traits = { git = "https://github.com/dasobral/openmls.git", rev = "6daabe33ddb616a6ed54b511d333e691db18a99f" }
openmls_rust_crypto = { git = "https://github.com/dasobral/openmls.git", rev = "6daabe33ddb616a6ed54b511d333e691db18a99f" }
openmls_sqlite_storage = { git = "https://github.com/dasobral/openmls.git", rev = "6daabe33ddb616a6ed54b511d333e691db18a99f" }
openmls_basic_credential = { git = "https://github.com/dasobral/openmls.git", rev = "6daabe33ddb616a6ed54b511d333e691db18a99f", features = ["clonable"] }
tls_codec = "0.5"
openmls_qrand = { git = "https://github.com/dasobral/openmls-qrand.git", rev = "dc8dced82e1edbe13579cc64ad2e1fcc348d8a72" }
ed25519-dalek = "2"
zeroize = "1"
toml = "0.9"
url = "2"

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"
base64 = "0.22"

# openmls-qrand depends on crates.io openmls_traits 0.6.0. Redirect it to the
# pinned fork so a single OpenMlsRand/OpenMlsProvider trait set is in the graph.
[patch.crates-io]
openmls_traits = { git = "https://github.com/dasobral/openmls.git", rev = "6daabe33ddb616a6ed54b511d333e691db18a99f" }
