[package]
name = "agent-trust"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false
description = "Experimental authorization/capability consistency laboratory"

[lib]
name = "agent_trust"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
openmls = { git = "https://github.com/dasobral/openmls.git", rev = "6daabe33ddb616a6ed54b511d333e691db18a99f" }
openmls_traits = { git = "https://github.com/dasobral/openmls.git", rev = "6daabe33ddb616a6ed54b511d333e691db18a99f" }
openmls_rust_crypto = { git = "https://github.com/dasobral/openmls.git", rev = "6daabe33ddb616a6ed54b511d333e691db18a99f" }
openmls_basic_credential = { git = "https://github.com/dasobral/openmls.git", rev = "6daabe33ddb616a6ed54b511d333e691db18a99f", features = ["clonable"] }
tls_codec = "0.5"

[dev-dependencies]
tempfile = "3"
