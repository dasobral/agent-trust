[package]
name = "agent-trust"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false
description = "Experimental authorization/capability consistency laboratory"

[lib]
name = "agent_trust"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
openmls = "=0.9.0"
openmls_traits = "=0.6.0"
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = { version = "=0.6.0", features = ["clonable"] }
tls_codec = "0.5"

[dev-dependencies]
tempfile = "3"
