name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  local:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests and every experiment (local backend)
        run: SCALE=1 scripts/ci.sh
      - name: Keep the run directories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e1-local-runs
          path: |
            runs/*/report.*
            runs/*/trace.json
            runs/*/service-logs/

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests, image and experiments (compose backend)
        run: BACKEND=compose EXPERIMENTS="e1-revocation-fence e1-revocation-fence-mtls e3-restarts" scripts/ci.sh
      - name: Keep the run directories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e1-compose-runs
          path: |
            runs/*/report.*
            runs/*/trace.json
            runs/*/service-logs/

  k3s:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Install k3s
        run: sudo deploy/k3s/install-k3s.sh
      - name: Build and import the image
        run: |
          ./attctl build
          ./attctl image
          deploy/k3s/import-image.sh
      - name: Experiments on k3s
        run: |
          sudo chmod 644 /etc/rancher/k3s/k3s.yaml
          BACKEND=k8s EXPERIMENTS="e1-revocation-fence e1-revocation-fence-mtls e3-restarts" scripts/ci.sh
      - name: Keep the run directories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k3s-runs
          path: |
            runs/*/report.*
            runs/*/trace.json
            runs/*/service-logs/
